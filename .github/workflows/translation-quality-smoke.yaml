name: Translation quality comparison

on:
  push:
    branches: ['feat/wiki-nine-language-foundation']
    paths:
      - 'scripts/translation-quality-smoke.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/translation-quality-smoke.py
